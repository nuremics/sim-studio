[workspace]
channels = ["conda-forge", "https://prefix.dev/sofa-framework"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.9,<3.15"
marimo = ">=0.14.17,<0.19.8"
pandas = ">=2.1.1,<4"
platformdirs = ">=3.5,<5"
pyyaml = ">=5.4.1,<7"
rclone = ">=1.72.1,<2"
ruff = ">=0.12.7,<0.16"

[pypi-dependencies]
sim-studio = { path = ".", editable = true }
sim-labs = { path = "../sim-labs", editable = true }

[tasks]
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"

[feature.DEMO_APP.dependencies]
matplotlib = ">=3.9.4,<4"
pygame = ">=2.6.1,<3"
pymunk = ">=7.0.1,<8"
xlsxwriter = ">=3.2.3,<4"
openpyxl = ">=3.1.5,<4"

[feature.DEMO_APP.tasks]
DEMO_APP = "NUREMICS_APP=general.DEMO_APP marimo run src/nuremics_studio/nuRemics_App.py"
DEMO_APP-edit = "NUREMICS_APP=general.DEMO_APP marimo edit src/nuremics_studio/nuRemics_App.py"

[feature.CANTILEVER_SHEAR_APP.dependencies]
pythonocc-core = ">=7.4.0,<8"
openpyxl = ">=3.1.5,<4"
sofa-app = "=25.6.0"
sofa-python3 = "=25.6.0"

[feature.CANTILEVER_SHEAR_APP.pypi-dependencies]
gmsh = ">=4.15.0,<5"
meshio = ">=5.3.5,<6"
numpy = ">=2.4.2,<3"
pyvista = { version = ">=0.48.0,<1", extras = ["jupyter"] }
imageio = { version =  ">=2.37.0,<3", extras = ["ffmpeg"] }

[feature.CANTILEVER_SHEAR_APP.tasks]
CANTILEVER_SHEAR_APP = "NUREMICS_APP=simulation.CANTILEVER_SHEAR_APP marimo run src/nuremics_studio/nuRemics_App.py"
CANTILEVER_SHEAR_APP-edit = "NUREMICS_APP=simulation.CANTILEVER_SHEAR_APP marimo edit src/nuremics_studio/nuRemics_App.py"

[feature.FLOW_BEND_APP.dependencies]
pythonocc-core = ">=7.4.0,<8"

[feature.FLOW_BEND_APP.pypi-dependencies]
gmsh = ">=4.15.0,<5"
meshio = ">=5.3.5,<6"
numpy = ">=2.4.2,<3"
pyvista = { version = ">=0.48.0,<1", extras = ["jupyter"] }
imageio = { version =  ">=2.37.0,<3", extras = ["ffmpeg"] }

[feature.FLOW_BEND_APP.tasks]
FLOW_BEND_APP = "NUREMICS_APP=simulation.FLOW_BEND_APP marimo run src/nuremics_studio/nuRemics_App.py"
FLOW_BEND_APP-edit = "NUREMICS_APP=simulation.FLOW_BEND_APP marimo edit src/nuremics_studio/nuRemics_App.py"

[environments]
demo = ["DEMO_APP"]
cantilever-shear = ["CANTILEVER_SHEAR_APP"]
flow-bend = ["FLOW_BEND_APP"]